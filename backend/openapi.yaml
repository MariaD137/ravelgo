      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubscriptionPlan" }
    post:
      tags: [Subscriptions]
      summary: Create a subscription plan (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, priceMonthly]
              properties:
                name: { type: string }
                description: { type: string }
                priceMonthly: { type: number }
      responses:
        "201":
          description: Plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionPlan" }

  /payments/mine:
    get:
      tags: [Payments]
      summary: My own payment history (any authenticated user)
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }
  /payments:
    get:
      tags: [Payments]
      summary: All payments (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated payments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedPayment" }

  /loyalty-tiers:
    get:
      tags: [Loyalty & Promotions]
      summary: Browse the loyalty tier ladder (any authenticated user)
      responses:
        "200":
          description: Tiers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoyaltyTier" }
    post:
      tags: [Loyalty & Promotions]
      summary: Define a loyalty tier (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, minCompletedTrips, discountPercent]
              properties:
                name: { type: string }
                minCompletedTrips: { type: integer }
                discountPercent: { type: number }
                perks: { type: string }
      responses:
        "201":
          description: Tier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltyTier" }

  /promotions:
    get:
      tags: [Loyalty & Promotions]
      summary: Browse active, unexpired promotions (any authenticated user)
      responses:
        "200":
          description: Promotions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Promotion" }
    post:
      tags: [Loyalty & Promotions]
      summary: Create a promotion code (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, description, discountPercent]
              properties:
                code: { type: string }
                description: { type: string }
                discountPercent: { type: number }
                expiresAt: { type: string, format: date-time }
                maxRedemptions: { type: integer }
      responses:
        "201":
          description: Promotion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promotion" }
  /promotions/{code}/redeem:
    post:
      tags: [Loyalty & Promotions]
      summary: Redeem a promotion code, once per user (any authenticated user)
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Redemption + discount
          content:
            application/json:
              schema:
                type: object
                properties:
                  redemption: { $ref: "#/components/schemas/PromotionRedemption" }
                  discountPercent: { type: number }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Expired, redemption limit reached, or already redeemed by this user

  /pricing-rules:
    get:
      tags: [Pricing]
      summary: Browse pricing rules (any authenticated user)
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PricingRule" }
    post:
      tags: [Pricing]
      summary: Define a pricing rule (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, baseFare, perKm, perMinute]
              properties:
                name: { type: string }
                baseFare: { type: number }
                perKm: { type: number }
                perMinute: { type: number }
      responses:
        "201":
          description: Rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }
  /pricing-rules/{id}:
    patch:
      tags: [Pricing]
      summary: Update or (de)activate a pricing rule (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                baseFare: { type: number }
                perKm: { type: number }
                perMinute: { type: number }
                active: { type: boolean }
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingRule" }

  /surge-zones:
    get:
      tags: [Pricing]
      summary: Browse surge zones (any authenticated user)
      responses:
        "200":
          description: Zones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SurgeZone" }
    post:
      tags: [Pricing]
      summary: Define a surge zone (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, location, multiplier]
              properties:
                name: { type: string }
                location: { type: string }
                multiplier: { type: number }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
      responses:
        "201":
          description: Zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurgeZone" }
  /surge-zones/{id}:
    patch:
      tags: [Pricing]
      summary: Update or (de)activate a surge zone (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                location: { type: string }
                multiplier: { type: number }
                active: { type: boolean }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
      responses:
        "200":
          description: Updated zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SurgeZone" }

  /pricing/quote:
    get:
      tags: [Pricing]
      summary: Get a fare estimate (any authenticated user)
      parameters:
        - name: distanceKm
          in: query
          required: true
          schema: { type: number }
        - name: durationMinutes
          in: query
          required: true
          schema: { type: number }
        - name: zone
          in: query
          schema: { type: string }
          description: Matched case-insensitively against an active SurgeZone's name
      responses:
        "200":
          description: Fare estimate
          content:
            application/json:
              schema:
                type: object
                properties:
                  estimatedFare: { type: number }
                  pricingRule: { type: string }
                  surgeMultiplier: { type: number }
                  surgeZone: { type: string, nullable: true }
        "409":
          description: No active pricing rule configured

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Cognito access token

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Validation error
    Unauthorized:
      description: Missing or invalid bearer token
    Forbidden:
      description: Caller lacks the required Cognito group
    NotFound:
      description: Resource not found

  schemas:
    DriverStatus:
      type: string
      enum: [ACTIVE, PENDING_REVIEW, SUSPENDED]

    User:
      type: object
      properties:
        id: { type: string }
        cognitoSub: { type: string }
        role: { type: string, enum: [RIDER, DRIVER, ADMIN] }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phoneNumber: { type: string, nullable: true }
        isLoyaltyMember: { type: boolean }
        suspended: { type: boolean }
        createdAt: { type: string, format: date-time }

    Driver:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        status: { $ref: "#/components/schemas/DriverStatus" }
        rating: { type: number }
        totalTrips: { type: integer }
        preferredLanguage: { type: string }
        subscriptionActive: { type: boolean }

    VehicleInput:
      type: object
      properties:
        brand: { type: string }
        model: { type: string }
        colour: { type: string }
        plateNumber: { type: string }
        year: { type: string }
        isPrimary: { type: boolean }

    Vehicle:
      allOf:
        - $ref: "#/components/schemas/VehicleInput"
        - type: object
          properties:
            id: { type: string }
            driverId: { type: string }
            listedForRental: { type: boolean }

    RentalListing:
      type: object
      properties:
        id: { type: string }
        driverId: { type: string }
        vehicleId: { type: string }
        dailyRate: { type: number }
        location: { type: string }
        status: { type: string, enum: [PENDING_APPROVAL, APPROVED, REJECTED] }

    Trip:
      type: object
      properties:
        id: { type: string }
        riderId: { type: string }
        driverId: { type: string, nullable: true }
        pickup: { type: string }
        destination: { type: string }
        estimatedFare: { type: number }
        finalFare: { type: number, nullable: true }
        status: { type: string, enum: [REQUESTED, MATCHED, IN_PROGRESS, COMPLETED, CANCELLED, DISPUTED] }
        category: { type: string }

    DriverDocument:
      type: object
      properties:
        id: { type: string }
        driverId: { type: string }
        title: { type: string }
        status: { type: string, enum: [NOT_UPLOADED, PENDING, APPROVED, EXPIRING_SOON, REJECTED] }
        fileKey: { type: string, nullable: true }

    SupportTicket:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        subject: { type: string }
        category: { type: string }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }

    CarPaddyRequest:
      type: object
      properties:
        id: { type: string }
        driverId: { type: string }
        plateNumber: { type: string }
        status: { type: string, enum: [SUBMITTED, IN_REVIEW, APPROVED, REJECTED] }

    CourierRequestInput:
      type: object
      properties:
        pickupAddress: { type: string }
        dropoffAddress: { type: string }
        packageDescription: { type: string }
        recipientName: { type: string }
        recipientPhone: { type: string }
        estimatedFare: { type: number }

    CourierRequest:
      allOf:
        - $ref: "#/components/schemas/CourierRequestInput"
        - type: object
          properties:
            id: { type: string }
            senderId: { type: string }
            driverId: { type: string, nullable: true }
            finalFare: { type: number, nullable: true }
            status: { type: string, enum: [REQUESTED, MATCHED, IN_TRANSIT, DELIVERED, CANCELLED] }

    EmergencyAlert:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        tripId: { type: string, nullable: true }
        type: { type: string, enum: [SOS, FRAUD_SUSPECTED] }
        message: { type: string, nullable: true }
        status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }

    SubscriptionPlan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        priceMonthly: { type: number }
        active: { type: boolean }

    DriverSubscription:
      type: object
      properties:
        id: { type: string }
        driverId: { type: string }
        planId: { type: string }
        status: { type: string, enum: [ACTIVE, CANCELLED, EXPIRED] }
        currentPeriodEnd: { type: string, format: date-time }

    Payment:
      type: object
      properties:
        id: { type: string }
        tripId: { type: string }
        userId: { type: string }
        amount: { type: number }
        currency: { type: string }
        method: { type: string, enum: [CARD, CASH, WALLET] }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, REFUNDED] }

    LoyaltyTier:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        minCompletedTrips: { type: integer }
        discountPercent: { type: number }
        perks: { type: string, nullable: true }

    Promotion:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        description: { type: string }
        discountPercent: { type: number }
        active: { type: boolean }
        expiresAt: { type: string, format: date-time, nullable: true }
        maxRedemptions: { type: integer, nullable: true }
        redemptionCount: { type: integer }

    PromotionRedemption:
      type: object
      properties:
        id: { type: string }
        promotionId: { type: string }
        userId: { type: string }
        redeemedAt: { type: string, format: date-time }

    PricingRule:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        baseFare: { type: number }
        perKm: { type: number }
        perMinute: { type: number }
        active: { type: boolean }

    SurgeZone:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        multiplier: { type: number }
        active: { type: boolean }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }

    PaginatedUser:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/User" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedDriver:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Driver" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedTrip:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Trip" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedRentalListing:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/RentalListing" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedSupportTicket:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/SupportTicket" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedCarPaddyRequest:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/CarPaddyRequest" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedCourierRequest:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/CourierRequest" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedEmergencyAlert:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/EmergencyAlert" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedPayment:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Payment" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
