  /payouts/bank-account:
    post:
      tags: [Payouts]
      summary: Register or update my own bank account for payouts (Driver)
      description: >-
        Upserts the caller's bank account. Re-registering flips isVerified
        back to false, pending re-verification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverBankAccountInput" }
      responses:
        "201":
          description: Created or updated bank account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverBankAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Caller has no User row with role DRIVER
    get:
      tags: [Payouts]
      summary: My own bank account (Driver)
      responses:
        "200":
          description: Bank account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverBankAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Caller has no User row with role DRIVER, or no bank account registered yet
  /payouts/history:
    get:
      tags: [Payouts]
      summary: My own payout history (Driver)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated payouts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedPayout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Caller has no User row with role DRIVER
  /payouts/{id}:
    get:
      tags: [Payouts]
      summary: One of my own payouts (Driver)
      description: 404s (not 403) for a payout belonging to a different driver.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Payout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payouts/calculate:
    post:
      tags: [Payouts]
      summary: Calculate (without creating) a driver's payout for a period (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverId, period]
              properties:
                driverId: { type: string, description: A User.id with role DRIVER. }
                period: { type: string, pattern: "^\\d{4}-\\d{2}$", description: "YYYY-MM", example: "2026-07" }
      responses:
        "200":
          description: Payout calculation (gross/platform fee/subscription fee/net) — not persisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutCalculation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No User with that id and role DRIVER
  /payouts/create:
    post:
      tags: [Payouts]
      summary: Create a pending payout for a driver (Admin)
      description: >-
        With `amount` omitted, the payout is calculated the same way as
        POST /payouts/calculate; `amount` overrides the calculation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverId, period]
              properties:
                driverId: { type: string }
                period: { type: string, pattern: "^\\d{4}-\\d{2}$", example: "2026-07" }
                amount: { type: number, description: Manual override of the calculated amount. }
      responses:
        "201":
          description: Created payout (status PENDING)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No User with that id and role DRIVER
  /payouts/{id}/process:
    post:
      tags: [Payouts]
      summary: Mark a PENDING payout PROCESSING (Admin)
      description: >-
        Stripe Connect / actual bank transfer integration is not yet
        wired up (see services/payouts.ts) — this only advances status and
        stamps a placeholder transactionId.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Updated payout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Payout is not currently PENDING
  /payouts/{id}/complete:
    post:
      tags: [Payouts]
      summary: Mark a payout COMPLETED (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transactionId: { type: string }
      responses:
        "200":
          description: Updated payout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payouts/{id}/fail:
    post:
      tags: [Payouts]
      summary: Mark a payout FAILED with a reason (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [failureReason]
              properties:
                failureReason: { type: string }
      responses:
        "200":
          description: Updated payout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payouts:
    get:
      tags: [Payouts]
      summary: List all payouts, optionally filtered (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED] }
        - name: driverId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paginated payouts, each with the driver's id/name/email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedPayout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Cognito access token

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Validation or bad request error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Caller lacks the required Cognito group
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Conflict (e.g., duplicate resource)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimitExceeded:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    DriverStatus:
      type: string
      enum: [ACTIVE, PENDING_REVIEW, SUSPENDED]

    User:
      type: object
      properties:
        id: { type: string }
        cognitoSub: { type: string }
        role: { type: string, enum: [RIDER, DRIVER, ADMIN] }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phoneNumber: { type: string, nullable: true }
        isLoyaltyMember: { type: boolean }
        suspended: { type: boolean }
        createdAt: { type: string, format: date-time }

    Driver:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        status: { $ref: "#/components/schemas/DriverStatus" }
        rating: { type: number }
        totalTrips: { type: integer }
        preferredLanguage: { type: string }
        subscriptionActive: { type: boolean }

    VehicleInput:
      type: object
      properties:
        brand: { type: string }
        model: { type: string }
        colour: { type: string }
        plateNumber: { type: string }
        year: { type: string }
        isPrimary: { type: boolean }

    Vehicle:
      allOf:
        - $ref: "#/components/schemas/VehicleInput"
        - type: object
          properties:
            id: { type: string }
            driverId: { type: string }
            listedForRental: { type: boolean }

    RentalListing:
      type: object
      properties:
        id: { type: string }
        driverId: { type: string }
        vehicleId: { type: string }
        dailyRate: { type: number }
        location: { type: string }
        status: { type: string, enum: [PENDING_APPROVAL, APPROVED, REJECTED] }

    RentalBooking:
      type: object
      properties:
        id: { type: string }
        rentalListingId: { type: string }
        renterId: { type: string }
        vehicleId: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        price: { type: number }
        status: { type: string, enum: [REQUESTED, CONFIRMED, ACTIVE, COMPLETED, CANCELLED, REJECTED] }
        paymentStatus:
          type: string
          enum: [NOT_CONFIGURED]
          description: >-
            No Stripe/payment-processor integration exists yet — this is
            always NOT_CONFIGURED, an explicit non-payment state rather than
            a faked success.

    Trip:
      type: object
      properties:
        id: { type: string }
        riderId: { type: string }
        driverId: { type: string, nullable: true }
        pickup: { type: string }
        destination: { type: string }
        estimatedFare: { type: number }
        finalFare: { type: number, nullable: true }
        status: { type: string, enum: [REQUESTED, MATCHED, IN_PROGRESS, COMPLETED, CANCELLED, DISPUTED] }
        category: { type: string }

    DriverDocument:
      type: object
      properties:
        id: { type: string }
        driverId: { type: string }
        title: { type: string }
        status: { type: string, enum: [NOT_UPLOADED, PENDING, APPROVED, EXPIRING_SOON, REJECTED] }
        fileKey: { type: string, nullable: true }

    SupportTicket:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        subject: { type: string }
        category: { type: string }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }

    CarPaddyRequest:
      type: object
      properties:
        id: { type: string }
        driverId: { type: string }
        plateNumber: { type: string }
        status: { type: string, enum: [SUBMITTED, IN_REVIEW, APPROVED, REJECTED] }

    CourierRequestInput:
      type: object
      required: [pickupAddress, dropoffAddress, packageDescription, recipientName, recipientPhone, estimatedFare]
      properties:
        pickupAddress: { type: string }
        dropoffAddress: { type: string }
        packageDescription: { type: string }
        recipientName: { type: string }
        recipientPhone: { type: string }
        estimatedFare: { type: number }

    CourierRequest:
      allOf:
        - $ref: "#/components/schemas/CourierRequestInput"
        - type: object
          properties:
            id: { type: string }
            senderId: { type: string }
            driverId: { type: string, nullable: true }
            finalFare: { type: number, nullable: true }
            status: { type: string, enum: [REQUESTED, MATCHED, IN_TRANSIT, DELIVERED, CANCELLED] }

    EmergencyAlert:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        tripId: { type: string, nullable: true }
        type: { type: string, enum: [SOS, FRAUD_SUSPECTED] }
        message: { type: string, nullable: true }
        status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }

    SubscriptionPlan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        priceMonthly: { type: number }
        active: { type: boolean }

    DriverSubscription:
      type: object
      properties:
        id: { type: string }
        driverId: { type: string }
        planId: { type: string }
        status: { type: string, enum: [ACTIVE, CANCELLED, EXPIRED] }
        currentPeriodEnd: { type: string, format: date-time }

    Payment:
      type: object
      properties:
        id: { type: string }
        tripId: { type: string }
        userId: { type: string }
        amount: { type: number }
        currency: { type: string }
        method: { type: string, enum: [CARD, CASH, WALLET] }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, REFUNDED] }

    DriverBankAccountInput:
      type: object
      properties:
        accountHolderName: { type: string }
        bankName: { type: string }
        accountNumber: { type: string, minLength: 8 }
        routingNumber: { type: string, minLength: 9 }
        accountType: { type: string, enum: [CHECKING, SAVINGS], default: CHECKING }

    DriverBankAccount:
      allOf:
        - $ref: "#/components/schemas/DriverBankAccountInput"
        - type: object
          properties:
            id: { type: string }
            driverId: { type: string, description: A User.id (not the Cognito sub). }
            isVerified: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    Payout:
      type: object
      properties:
        id: { type: string }
        driverId: { type: string, description: A User.id (not the Cognito sub). }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED] }
        period: { type: string, example: "2026-07" }
        transactionId: { type: string, nullable: true }
        failureReason: { type: string, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    PayoutCalculation:
      type: object
      properties:
        driverId: { type: string }
        grossAmount: { type: number, description: Sum of SUCCEEDED payments on this driver's COMPLETED trips in the period. }
        platformFee: { type: number }
        subscriptionFee: { type: number, description: The driver's active subscription's monthly price, if any. }
        netAmount: { type: number, description: grossAmount - platformFee - subscriptionFee, floored at 0. }
        tripsIncluded: { type: integer }
        period: { type: string }

    LoyaltyTier:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        minCompletedTrips: { type: integer }
        discountPercent: { type: number }
        perks: { type: string, nullable: true }

    Promotion:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        description: { type: string }
        discountPercent: { type: number }
        active: { type: boolean }
        expiresAt: { type: string, format: date-time, nullable: true }
        maxRedemptions: { type: integer, nullable: true }
        redemptionCount: { type: integer }

    PromotionRedemption:
      type: object
      properties:
        id: { type: string }
        promotionId: { type: string }
        userId: { type: string }
        redeemedAt: { type: string, format: date-time }

    PricingRule:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        baseFare: { type: number }
        perKm: { type: number }
        perMinute: { type: number }
        active: { type: boolean }

    SurgeZone:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        multiplier: { type: number }
        active: { type: boolean }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }

    PaginatedUser:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/User" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedDriver:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Driver" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedTrip:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Trip" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedRentalListing:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/RentalListing" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedSupportTicket:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/SupportTicket" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedCarPaddyRequest:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/CarPaddyRequest" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedCourierRequest:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/CourierRequest" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedEmergencyAlert:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/EmergencyAlert" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedPayment:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Payment" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedPayout:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Payout" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    # Standardized error response (PL-01)
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, timestamp]
          properties:
            code:
              type: string
              description: Machine-readable error code
              enum:
                - VALIDATION_ERROR
                - AUTHENTICATION_ERROR
                - AUTHORIZATION_ERROR
                - NOT_FOUND
                - CONFLICT
                - INTERNAL_SERVER_ERROR
                - RATE_LIMIT_EXCEEDED
                - BAD_REQUEST
                - PAYMENT_ERROR
                - DATABASE_ERROR
            message:
              type: string
              description: Human-readable error message
            details:
              type: array
              nullable: true
              description: Field-level validation errors
              items:
                type: object
                properties:
                  field: { type: string, description: "Field name or path (e.g., \"email\", \"address.zipCode\")" }
                  message: { type: string, description: Error message for this field }
                  code: { type: string, nullable: true, description: "Error code (e.g., \"too_small\", \"invalid_email\")" }
            timestamp:
              type: string
              format: date-time
              description: When the error occurred (ISO 8601)
