openapi: 3.0.3
info:
  title: RavelGo API
  version: "0.1.0"
  description: >
    Unified REST API for the RavelGo rider, driver, and admin apps.
    Authenticated with Amazon Cognito access tokens; role checks are enforced
    via Cognito group membership (`Rider`, `Driver`, `Admin`) — see
    `src/middleware/auth.ts`. There is also a WebSocket endpoint
    (`wss://<host>/ws?token=<access token>`) for live trip-status and
    driver-location push, not representable in OpenAPI 3.0 — see
    `docs/realtime-architecture.md` for its wire protocol. Every REST
    endpoint below has an HTTP-polling equivalent, so a client never
    strictly needs the WebSocket connection.
servers:
  - url: /api
security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Riders
  - name: Drivers
  - name: Vehicles
  - name: Rentals
  - name: Trips
  - name: Documents
  - name: Support
  - name: Uploads
  - name: Car Paddy
  - name: Admin
  - name: Courier
  - name: Notifications
  - name: Emergency Alerts
  - name: Subscriptions
  - name: Payments
  - name: Wallet
  - name: Loyalty & Promotions
  - name: Pricing

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness/readiness check
      security: []
      responses:
        "200":
          description: Database reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: connected }
                  timestamp: { type: string, format: date-time }
        "503":
          description: Database unreachable

  /riders:
    get:
      tags: [Riders]
      summary: List riders (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated riders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUser"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /riders/me:
    post:
      tags: [Riders]
      summary: Create/upsert my rider profile (Rider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                phoneNumber: { type: string }
      responses:
        "201":
          description: Rider profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Riders]
      summary: My own rider profile (Rider)
      responses:
        "200":
          description: Rider profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
  /riders/me/loyalty:
    get:
      tags: [Loyalty & Promotions]
      summary: My current loyalty tier, computed from completed trips (Rider)
      responses:
        "200":
          description: Completed trip count and computed tier
          content:
            application/json:
              schema:
                type: object
                properties:
                  completedTrips: { type: integer }
                  currentTier:
                    oneOf:
                      - $ref: "#/components/schemas/LoyaltyTier"
                      - nullable: true
        "404": { $ref: "#/components/responses/NotFound" }
  /riders/{id}:
    get:
      tags: [Riders]
      summary: Get a rider with trip history (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Rider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
  /riders/{id}/status:
    patch:
      tags: [Riders]
      summary: Suspend/reactivate a rider (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended: { type: boolean }
      responses:
        "200":
          description: Updated rider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /drivers:
    get:
      tags: [Drivers]
      summary: List drivers (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated drivers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedDriver" }
  /drivers/me:
    post:
      tags: [Drivers]
      summary: Create/upsert my driver profile (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                phoneNumber: { type: string }
                preferredLanguage: { type: string, default: English }
      responses:
        "201":
          description: Driver profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
    get:
      tags: [Drivers]
      summary: My own driver profile (Driver)
      responses:
        "200":
          description: Driver profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "404": { $ref: "#/components/responses/NotFound" }
  /drivers/me/subscription:
    post:
      tags: [Subscriptions]
      summary: Subscribe (or switch) to a plan (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, currentPeriodEnd]
              properties:
                planId: { type: string }
                currentPeriodEnd: { type: string, format: date-time }
      responses:
        "201":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverSubscription" }
    get:
      tags: [Subscriptions]
      summary: My own subscription (Driver)
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverSubscription" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Subscriptions]
      summary: Cancel my own subscription (Driver)
      responses:
        "200":
          description: Cancelled subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverSubscription" }
        "404": { $ref: "#/components/responses/NotFound" }
  /drivers/{id}:
    get:
      tags: [Drivers]
      summary: Get a driver with documents (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "404": { $ref: "#/components/responses/NotFound" }
  /drivers/{id}/status:
    patch:
      tags: [Drivers]
      summary: Suspend/reactivate a driver (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/DriverStatus" }
      responses:
        "200":
          description: Updated driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }

  /vehicles/me:
    get:
      tags: [Vehicles]
      summary: My own vehicles (Driver)
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vehicle" }
  /vehicles:
    post:
      tags: [Vehicles]
      summary: Add a vehicle (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "201":
          description: Created vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
  /vehicles/{id}:
    patch:
      tags: [Vehicles]
      summary: Update one of my own vehicles (Driver)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleUpdateInput" }
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "404": { $ref: "#/components/responses/NotFound" }

  /rentals:
    post:
      tags: [Rentals]
      summary: List a vehicle for luxury rental (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleId, dailyRate, location]
              properties:
                vehicleId: { type: string }
                dailyRate: { type: number }
                location: { type: string }
      responses:
        "201":
          description: Rental listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalListing" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Rentals]
      summary: Browse rental listings (approved only, unless Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated rental listings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedRentalListing" }
  /rentals/mine:
    get:
      tags: [Rentals]
      summary: My own rental listings (Driver)
      responses:
        "200":
          description: Rental listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RentalListing" }
  /rentals/{id}/status:
    patch:
      tags: [Rentals]
      summary: Approve/reject a rental listing (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalListing" }

  /trips:
    post:
      tags: [Trips]
      summary: Request a trip (Rider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup, destination, distanceKm, durationMinutes]
              properties:
                pickup: { type: string }
                destination: { type: string }
                distanceKm: { type: number, minimum: 0, maximum: 2000, description: Trip distance; the fare is computed server-side from this against the active pricing rule }
                durationMinutes: { type: number, minimum: 0, maximum: 1440 }
                zone: { type: string, description: Optional surge zone name }
                category: { type: string, default: Personal }
                pickupNote: { type: string }
              description: The rider never sends the fare — estimatedFare is computed server-side from the active PricingRule and returned on the created Trip.
      responses:
        "201":
          description: Trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Trips]
      summary: Monitor all trips (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated trips
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedTrip" }
  /trips/{id}:
    get:
      tags: [Trips]
      summary: View a trip (rider/driver party to it, or Admin)
      description: >-
        Includes the trip's real `payment` (method/status/amount/paidAt) for
        the trip's own rider/driver, not just Admin — this is the only
        trip-fetch that does (GET /trips/mine deliberately omits it).
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Trip, with payment attached for the owner or Admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /trips/{id}/status:
    patch:
      tags: [Trips]
      summary: Advance trip status (Driver or Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [MATCHED, IN_PROGRESS, COMPLETED, CANCELLED, DISPUTED] }
                finalFare: { type: number }
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
  /trips/{id}/driver-location:
    get:
      tags: [Trips]
      summary: >-
        Poll the assigned driver's last known location (HTTP fallback for a
        client not holding a live WebSocket connection — see /docs on the
        WS wire protocol for the live-push equivalent)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Last known location
          content:
            application/json:
              schema:
                type: object
                properties:
                  driverId: { type: string }
                  lat: { type: number }
                  lng: { type: number }
                  updatedAt: { type: string, format: date-time }
                  presence:
                    type: string
                    enum: [LIVE, STALE]
                    description: >-
                      Same freshness model the admin Live Map and the
                      customer delivery-tracking screen use (EI-2) — never
                      recomputed independently by a client.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Trip not found, no driver assigned yet, or no location reported yet
  /trips/{id}/charge:
    post:
      tags: [Payments]
      summary: >-
        Charge the rider for a completed trip's final (tax-inclusive) fare
        (Driver on the trip, or Admin). CARD initializes a real Paystack
        transaction and returns the Payment as PENDING plus an
        authorizationUrl for the mobile app to open; the outcome lands
        asynchronously via POST /billing/webhook. WALLET debits the rider's
        Paystack-funded RavelGo balance and settles immediately. Cash is not
        a payment method.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [CARD, WALLET], default: CARD }
      responses:
        "201":
          description: Payment record (PENDING with an authorizationUrl for CARD, SUCCEEDED for WALLET)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Payment"
                  - type: object
                    properties:
                      authorizationUrl: { type: string, nullable: true }
        "402":
          description: Wallet balance insufficient for the fare
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Trip not eligible to be charged, already charged, or rider has no wallet

  /payments/{id}/receipt:
    get:
      tags: [Payments]
      summary: A receipt for a charged trip (the paying rider, or Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId: { type: string }
                  tripId: { type: string }
                  pickup: { type: string }
                  destination: { type: string }
                  amount: { type: number }
                  currency: { type: string }
                  method: { type: string, enum: [CARD, CASH, WALLET] }
                  status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, REFUNDED] }
                  paidAt: { type: string, format: date-time, nullable: true }
                  issuedAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /billing/webhook:
    post:
      tags: [Payments]
      summary: Paystack webhook (not called by any RavelGo client — Paystack calls this directly)
      security: []
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A raw Paystack event payload; signature-verified (HMAC-SHA512) against PAYSTACK_SECRET_KEY
      responses:
        "200":
          description: Acknowledged
        "400":
          description: Missing/invalid signature

  /documents/me:
    get:
      tags: [Documents]
      summary: My own driver documents (Driver)
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DriverDocument" }
  /documents/{id}/url:
    get:
      tags: [Documents]
      summary: >-
        A short-lived (5 min) presigned URL to view one of the calling
        driver's OWN documents (Driver, ownership-enforced — a document
        belonging to a different driver, or one that doesn't exist, both
        404).
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Signed URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expiresIn: { type: integer }
        "404":
          description: Document not found, belongs to a different driver, or has no file uploaded yet
  /documents:
    post:
      tags: [Documents]
      summary: Register an uploaded document's metadata (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, fileKey]
              properties:
                title: { type: string }
                fileKey: { type: string }
      responses:
        "201":
          description: Document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDocument" }
  /documents/{id}/review:
    patch:
      tags: [Documents]
      summary: Approve/reject a document (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDocument" }

  /support-tickets:
    post:
      tags: [Support]
      summary: Open a support ticket (any authenticated user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, category]
              properties:
                subject: { type: string }
                category: { type: string }
      responses:
        "201":
          description: Ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }
    get:
      tags: [Support]
      summary: List all support tickets (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated tickets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedSupportTicket" }
  /support-tickets/mine:
    get:
      tags: [Support]
      summary: My own support tickets (any authenticated user)
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportTicket" }
  /support-tickets/{id}/status:
    patch:
      tags: [Support]
      summary: Update ticket status (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }

  /uploads/presign:
    post:
      tags: [Uploads]
      summary: Get a short-lived S3 upload URL (any authenticated user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket, fileName, contentType]
              properties:
                bucket: { type: string, enum: [documents, assets] }
                fileName: { type: string }
                contentType: { type: string }
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl: { type: string }
                  fileKey: { type: string }
                  expiresIn: { type: integer }

  /car-paddy:
    post:
      tags: [Car Paddy]
      summary: Submit a Car Paddy (vehicle license renewal) request (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plateNumber]
              properties:
                plateNumber: { type: string }
      responses:
        "201":
          description: Request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarPaddyRequest" }
    get:
      tags: [Car Paddy]
      summary: List all Car Paddy requests (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCarPaddyRequest" }
  /car-paddy/{id}:
    patch:
      tags: [Car Paddy]
      summary: Approve/reject a Car Paddy request (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarPaddyRequest" }

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Admin dashboard KPIs (Admin)
      responses:
        "200":
          description: KPIs
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeTrips: { type: integer }
                  onlineDrivers: { type: integer }
                  pendingApprovals: { type: integer }

  /admin-users:
    get:
      tags: [AdminUsers]
      summary: List all admin-group users (Super Admin / manage_admins)
      responses:
        "200":
          description: Admin users
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
    post:
      tags: [AdminUsers]
      summary: Invite a new admin user (Super Admin / manage_admins)
      description: >
        Cognito creates the account and emails a temporary password —
        nothing in this API ever handles, stores, or returns a password.
        Email is normalized (trimmed + lowercased) before the duplicate
        check and storage. Rate-limited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserInvite" }
      responses:
        "201":
          description: Created admin user (status will be INVITED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "409": { description: "Email already registered (Postgres or Cognito)" }
  /admin-users/me:
    get:
      tags: [AdminUsers]
      summary: The calling admin's own profile (any Admin-group member)
      responses:
        "200":
          description: Own profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
  /admin-users/me/mfa-enrolled:
    post:
      tags: [AdminUsers]
      summary: Record that the calling admin just completed TOTP MFA enrollment (any Admin-group member)
      description: >
        Audit-trail only — the enrollment itself happens directly between
        the Admin App and Cognito (AssociateSoftwareToken /
        VerifySoftwareToken / SetUserMFAPreference). Cognito remains the
        source of truth for mfaEnabled on every AdminUser response.
      responses:
        "204": { description: Recorded }
  /admin-users/{id}:
    get:
      tags: [AdminUsers]
      summary: View one admin's detail (Super Admin / manage_admins)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Admin user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin-users/{id}/role:
    patch:
      tags: [AdminUsers]
      summary: Change an admin's permission preset (Super Admin / manage_admins)
      description: Rejected with 409 if it would leave zero Super Admins.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminRole]
              properties:
                adminRole: { $ref: "#/components/schemas/AdminRole" }
      responses:
        "200":
          description: Updated admin user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Would leave zero Super Admins" }
  /admin-users/{id}/status:
    patch:
      tags: [AdminUsers]
      summary: Suspend/reinstate an admin account (Super Admin / manage_admins)
      description: >
        Suspending also disables the Cognito account outright. Rejected with
        400 if the caller targets their own account, and with 409 if it
        would leave zero active Super Admins.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended: { type: boolean }
      responses:
        "200":
          description: Updated admin user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { description: "Cannot change your own account status" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Would leave zero active Super Admins" }
  /admin-users/{id}/resend-invitation:
    post:
      tags: [AdminUsers]
      summary: Re-send an admin's invitation email (Super Admin / manage_admins)
      description: Rejected with 409 once the admin has already signed in and set a password. Rate-limited.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Admin user (still INVITED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Admin has already set a password" }
  /admin-users/{id}/password-reset:
    post:
      tags: [AdminUsers]
      summary: Admin-initiated password reset for another admin (Super Admin / manage_admins)
      description: >
        Same underlying Cognito flow as self-service "Forgot password?",
        triggered by a Super Admin instead of the account owner. Never
        returns, stores, or logs a password or reset code. Rate-limited.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Admin user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "404": { $ref: "#/components/responses/NotFound" }

