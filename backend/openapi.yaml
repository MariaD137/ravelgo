  /notifications:
    get:
      tags: [Notifications]
      summary: My own notifications, newest first (caller only)
      description: >-
        Scoped entirely to the authenticated caller — there is no way to
        pass another user's id in, so this can never leak another
        customer's notifications.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated notifications, plus an unread count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedNotification" }
  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one of my own notifications as read
      description: >-
        404s (not 403) for a notification that exists but belongs to
        someone else, so the response can't be used to enumerate other
        users' notification ids.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all of my own unread notifications as read
      responses:
        "200":
          description: Count of notifications updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
  /notifications/device-tokens:
    post:
      tags: [Notifications]
      summary: Register (or re-register) a device token for push delivery
      description: >-
        Ownership always comes from the authenticated Cognito identity —
        there is no field in the request body a client could use to
        register a token against a different user. A token is unique
        platform-wide (the OS can hand the same token to a different
        install later), so re-registering an already-known token simply
        reassigns it to whoever registers it now, rather than erroring as
        a duplicate. Sent through AWS Pinpoint (see
        backend/src/services/push.ts) — no separate "endpoint" resource
        needs to be pre-created, so this is a pure database write.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceTokenInput" }
      responses:
        "201":
          description: Registration result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceTokenRegistration" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [Notifications]
      summary: Unregister my own device token (e.g. on logout)
      description: >-
        404s (not 403) for a token that exists but belongs to someone
        else, same reasoning as the notification-read route above.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Unregistered }
        "404": { $ref: "#/components/responses/NotFound" }

