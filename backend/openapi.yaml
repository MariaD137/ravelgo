openapi: 3.0.3
info:
  title: RavelGo API
  version: "0.1.0"
  description: >
    Unified REST API for the RavelGo rider, driver, and admin apps.
    Authenticated with Amazon Cognito access tokens; role checks are enforced
    via Cognito group membership (`Rider`, `Driver`, `Admin`) — see
    `src/middleware/auth.ts`. There is also a WebSocket endpoint
    (`wss://<host>/ws?token=<access token>`) for live trip-status and
    driver-location push, not representable in OpenAPI 3.0 — see
    `docs/realtime-architecture.md` for its wire protocol. Every REST
    endpoint below has an HTTP-polling equivalent, so a client never
    strictly needs the WebSocket connection.
servers:
  - url: /api
security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Riders
  - name: Drivers
  - name: Vehicles
  - name: Rentals
  - name: Trips
  - name: Documents
  - name: Support
  - name: Uploads
  - name: Car Paddy
  - name: Admin
  - name: Courier
  - name: Emergency Alerts
  - name: Subscriptions
  - name: Payments
  - name: Loyalty & Promotions
  - name: Pricing

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness/readiness check
      security: []
      responses:
        "200":
          description: Database reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: connected }
                  timestamp: { type: string, format: date-time }
        "503":
          description: Database unreachable

  /riders:
    get:
      tags: [Riders]
      summary: List riders (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated riders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUser"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /riders/me:
    post:
      tags: [Riders]
      summary: Create/upsert my rider profile (Rider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                phoneNumber: { type: string }
      responses:
        "201":
          description: Rider profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Riders]
      summary: My own rider profile (Rider)
      responses:
        "200":
          description: Rider profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
  /riders/me/loyalty:
    get:
      tags: [Loyalty & Promotions]
      summary: My current loyalty tier, computed from completed trips (Rider)
      responses:
        "200":
          description: Completed trip count and computed tier
          content:
            application/json:
              schema:
                type: object
                properties:
                  completedTrips: { type: integer }
                  currentTier:
                    oneOf:
                      - $ref: "#/components/schemas/LoyaltyTier"
                      - nullable: true
        "404": { $ref: "#/components/responses/NotFound" }
  /riders/{id}:
    get:
      tags: [Riders]
      summary: Get a rider with trip history (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Rider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
  /riders/{id}/status:
    patch:
      tags: [Riders]
      summary: Suspend/reactivate a rider (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended: { type: boolean }
      responses:
        "200":
          description: Updated rider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /drivers:
    get:
      tags: [Drivers]
      summary: List drivers (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated drivers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedDriver" }
  /drivers/me:
    post:
      tags: [Drivers]
      summary: Create/upsert my driver profile (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                phoneNumber: { type: string }
                preferredLanguage: { type: string, default: English }
      responses:
        "201":
          description: Driver profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
    get:
      tags: [Drivers]
      summary: My own driver profile (Driver)
      responses:
        "200":
          description: Driver profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "404": { $ref: "#/components/responses/NotFound" }
  /drivers/me/subscription:
    post:
      tags: [Subscriptions]
      summary: Subscribe (or switch) to a plan (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, currentPeriodEnd]
              properties:
                planId: { type: string }
                currentPeriodEnd: { type: string, format: date-time }
      responses:
        "201":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverSubscription" }
    get:
      tags: [Subscriptions]
      summary: My own subscription (Driver)
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverSubscription" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Subscriptions]
      summary: Cancel my own subscription (Driver)
      responses:
        "200":
          description: Cancelled subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverSubscription" }
        "404": { $ref: "#/components/responses/NotFound" }
  /drivers/{id}:
    get:
      tags: [Drivers]
      summary: Get a driver with documents (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "404": { $ref: "#/components/responses/NotFound" }
  /drivers/{id}/status:
    patch:
      tags: [Drivers]
      summary: Suspend/reactivate a driver (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/DriverStatus" }
      responses:
        "200":
          description: Updated driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }

  /vehicles/me:
    get:
      tags: [Vehicles]
      summary: My own vehicles (Driver)
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vehicle" }
  /vehicles:
    post:
      tags: [Vehicles]
      summary: Add a vehicle (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "201":
          description: Created vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
  /vehicles/{id}:
    patch:
      tags: [Vehicles]
      summary: Update one of my own vehicles (Driver)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "404": { $ref: "#/components/responses/NotFound" }

  /rentals:
    post:
      tags: [Rentals]
      summary: List a vehicle for luxury rental (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleId, dailyRate, location]
              properties:
                vehicleId: { type: string }
                dailyRate: { type: number }
                location: { type: string }
      responses:
        "201":
          description: Rental listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalListing" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Rentals]
      summary: Browse rental listings (approved only, unless Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated rental listings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedRentalListing" }
  /rentals/mine:
    get:
      tags: [Rentals]
      summary: My own rental listings (Driver)
      responses:
        "200":
          description: Rental listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RentalListing" }
  /rentals/{id}/status:
    patch:
      tags: [Rentals]
      summary: Approve/reject a rental listing (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalListing" }

  /trips:
    post:
      tags: [Trips]
      summary: Request a trip (Rider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup, destination, estimatedFare]
              properties:
                pickup: { type: string }
                destination: { type: string }
                estimatedFare: { type: number }
                category: { type: string, default: Personal }
                pickupNote: { type: string }
      responses:
        "201":
          description: Trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
    get:
      tags: [Trips]
      summary: Monitor all trips (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated trips
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedTrip" }
  /trips/{id}:
    get:
      tags: [Trips]
      summary: View a trip (rider/driver party to it, or Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /trips/{id}/status:
    patch:
      tags: [Trips]
      summary: Advance trip status (Driver or Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [MATCHED, IN_PROGRESS, COMPLETED, CANCELLED, DISPUTED] }
                finalFare: { type: number }
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
  /trips/{id}/driver-location:
    get:
      tags: [Trips]
      summary: >-
        Poll the assigned driver's last known location (HTTP fallback for a
        client not holding a live WebSocket connection — see /docs on the
        WS wire protocol for the live-push equivalent)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Last known location
          content:
            application/json:
              schema:
                type: object
                properties:
                  driverId: { type: string }
                  lat: { type: number }
                  lng: { type: number }
                  updatedAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Trip not found, no driver assigned yet, or no location reported yet
  /trips/{id}/charge:
    post:
      tags: [Payments]
      summary: >-
        Charge the rider for a completed trip's final fare (Driver on the
        trip, or Admin). CARD creates a real Stripe PaymentIntent and
        returns the Payment as PENDING plus a clientSecret for the mobile
        app to confirm; the outcome (SUCCEEDED/FAILED) lands asynchronously
        via POST /billing/webhook. CASH/WALLET settle immediately, no
        Stripe involved.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [CARD, CASH, WALLET], default: CARD }
      responses:
        "201":
          description: Payment record (PENDING with a clientSecret for CARD, SUCCEEDED for CASH/WALLET)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Payment"
                  - type: object
                    properties:
                      clientSecret: { type: string, nullable: true }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Trip not eligible to be charged, or already charged

  /payments/{id}/receipt:
    get:
      tags: [Payments]
      summary: A receipt for a charged trip (the paying rider, or Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId: { type: string }
                  tripId: { type: string }
                  pickup: { type: string }
                  destination: { type: string }
                  amount: { type: number }
                  currency: { type: string }
                  method: { type: string, enum: [CARD, CASH, WALLET] }
                  status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, REFUNDED] }
                  paidAt: { type: string, format: date-time, nullable: true }
                  issuedAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /billing/webhook:
    post:
      tags: [Payments]
      summary: Stripe webhook (not called by any RavelGo client — Stripe calls this directly)
      security: []
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A raw Stripe Event payload; signature-verified against STRIPE_WEBHOOK_SECRET
      responses:
        "200":
          description: Acknowledged
        "400":
          description: Missing/invalid signature

  /documents/me:
    get:
      tags: [Documents]
      summary: My own driver documents (Driver)
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DriverDocument" }
  /documents:
    post:
      tags: [Documents]
      summary: Register an uploaded document's metadata (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, fileKey]
              properties:
                title: { type: string }
                fileKey: { type: string }
      responses:
        "201":
          description: Document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDocument" }
  /documents/{id}/review:
    patch:
      tags: [Documents]
      summary: Approve/reject a document (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDocument" }

  /support-tickets:
    post:
      tags: [Support]
      summary: Open a support ticket (any authenticated user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, category]
              properties:
                subject: { type: string }
                category: { type: string }
      responses:
        "201":
          description: Ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }
    get:
      tags: [Support]
      summary: List all support tickets (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated tickets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedSupportTicket" }
  /support-tickets/mine:
    get:
      tags: [Support]
      summary: My own support tickets (any authenticated user)
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportTicket" }
  /support-tickets/{id}/status:
    patch:
      tags: [Support]
      summary: Update ticket status (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }

  /uploads/presign:
    post:
      tags: [Uploads]
      summary: Get a short-lived S3 upload URL (any authenticated user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket, fileName, contentType]
              properties:
                bucket: { type: string, enum: [documents, assets] }
                fileName: { type: string }
                contentType: { type: string }
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl: { type: string }
                  fileKey: { type: string }
                  expiresIn: { type: integer }

  /car-paddy:
    post:
      tags: [Car Paddy]
      summary: Submit a Car Paddy (vehicle license renewal) request (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plateNumber]
              properties:
                plateNumber: { type: string }
      responses:
        "201":
          description: Request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarPaddyRequest" }
    get:
      tags: [Car Paddy]
      summary: List all Car Paddy requests (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCarPaddyRequest" }
  /car-paddy/{id}:
    patch:
      tags: [Car Paddy]
      summary: Approve/reject a Car Paddy request (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarPaddyRequest" }

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Admin dashboard KPIs (Admin)
      responses:
        "200":
          description: KPIs
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeTrips: { type: integer }
                  onlineDrivers: { type: integer }
                  pendingApprovals: { type: integer }

  /courier-requests:
    post:
      tags: [Courier]
      summary: Request a courier/package delivery (Rider)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourierRequestInput" }
      responses:
        "201":
          description: Courier request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierRequest" }
    get:
      tags: [Courier]
      summary: Monitor all courier requests (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated courier requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCourierRequest" }
  /courier-requests/available:
    get:
      tags: [Courier]
      summary: Unassigned courier requests to accept (Driver)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated available requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCourierRequest" }
  /courier-requests/{id}:
    get:
      tags: [Courier]
      summary: View a courier request (party to it, or Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Courier request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /courier-requests/{id}/accept:
    patch:
      tags: [Courier]
      summary: Accept a courier request (Driver)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Matched request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Request already matched
  /courier-requests/{id}/status:
    patch:
      tags: [Courier]
      summary: Advance courier status (assigned Driver, or Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [IN_TRANSIT, DELIVERED, CANCELLED] }
                finalFare: { type: number }
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /emergency-alerts:
    post:
      tags: [Emergency Alerts]
      summary: Raise an emergency/fraud alert (any authenticated user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [SOS, FRAUD_SUSPECTED] }
                tripId: { type: string }
                message: { type: string }
      responses:
        "201":
          description: Alert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmergencyAlert" }
    get:
      tags: [Emergency Alerts]
      summary: List all alerts, most urgent first (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated alerts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedEmergencyAlert" }
  /emergency-alerts/mine:
    get:
      tags: [Emergency Alerts]
      summary: My own alerts (any authenticated user)
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmergencyAlert" }
  /emergency-alerts/{id}/status:
    patch:
      tags: [Emergency Alerts]
      summary: Acknowledge or resolve an alert (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACKNOWLEDGED, RESOLVED] }
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmergencyAlert" }

  /subscription-plans:
    get:
      tags: [Subscriptions]
