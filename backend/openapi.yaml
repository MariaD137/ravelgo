openapi: 3.0.3
info:
  title: RavelGo API
  version: "0.1.0"
  description: >
    Unified REST API for the RavelGo rider, driver, and admin apps.
    Authenticated with Amazon Cognito access tokens; role checks are enforced
    via Cognito group membership (`Rider`, `Driver`, `Admin`) — see
    `src/middleware/auth.ts`. There is also a WebSocket endpoint
    (`wss://<host>/ws?token=<access token>`) for live trip-status and
    driver-location push, not representable in OpenAPI 3.0 — see
    `docs/realtime-architecture.md` for its wire protocol. Every REST
    endpoint below has an HTTP-polling equivalent, so a client never
    strictly needs the WebSocket connection.
servers:
  - url: /api
security:
  - bearerAuth: []

tags:
  - name: Health
  - name: Riders
  - name: Drivers
  - name: Vehicles
  - name: Rentals
  - name: Trips
  - name: Documents
  - name: Support
  - name: Uploads
  - name: Car Paddy
  - name: Admin
  - name: Courier
  - name: Emergency Alerts
  - name: Subscriptions
  - name: Payments
  - name: Loyalty & Promotions
  - name: Pricing
  - name: Payouts

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness/readiness check
      security: []
      responses:
        "200":
          description: Database reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: connected }
                  timestamp: { type: string, format: date-time }
        "503":
          description: Database unreachable

  /riders:
    get:
      tags: [Riders]
      summary: List riders (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated riders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUser"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /riders/me:
    post:
      tags: [Riders]
      summary: Create/upsert my rider profile (Rider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                phoneNumber: { type: string }
      responses:
        "201":
          description: Rider profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Riders]
      summary: My own rider profile (Rider)
      responses:
        "200":
          description: Rider profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Riders]
      summary: Update my own name/phone (Rider) — not email, which is tied to the Cognito identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
                phoneNumber: { type: string }
      responses:
        "200":
          description: Updated rider profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /riders/me/loyalty:
    get:
      tags: [Loyalty & Promotions]
      summary: My current loyalty tier, computed from completed trips (Rider)
      responses:
        "200":
          description: Completed trip count and computed tier
          content:
            application/json:
              schema:
                type: object
                properties:
                  completedTrips: { type: integer }
                  currentTier:
                    oneOf:
                      - $ref: "#/components/schemas/LoyaltyTier"
                      - nullable: true
        "404": { $ref: "#/components/responses/NotFound" }
  /riders/{id}:
    get:
      tags: [Riders]
      summary: Get a rider with trip history (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Rider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
  /riders/{id}/status:
    patch:
      tags: [Riders]
      summary: Suspend/reactivate a rider (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended: { type: boolean }
      responses:
        "200":
          description: Updated rider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /drivers:
    get:
      tags: [Drivers]
      summary: List drivers (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated drivers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedDriver" }
  /drivers/me:
    post:
      tags: [Drivers]
      summary: Create/upsert my driver profile (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                phoneNumber: { type: string }
                preferredLanguage: { type: string, default: English }
      responses:
        "201":
          description: Driver profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
    get:
      tags: [Drivers]
      summary: My own driver profile (Driver)
      responses:
        "200":
          description: Driver profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "404": { $ref: "#/components/responses/NotFound" }
  /drivers/me/online:
    patch:
      tags: [Drivers]
      summary: Go online/offline (Driver) — required for real-time matching eligibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [online]
              properties:
                online: { type: boolean }
      responses:
        "200":
          description: Updated driver profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /drivers/me/assignment:
    get:
      tags: [Drivers]
      summary: My current active assignment, if any (Driver) — Ride, Courier, or Rental
      responses:
        "200":
          description: The active DriverAssignment row, or null if the driver is free
          content:
            application/json:
              schema:
                nullable: true
                type: object
                properties:
                  id: { type: string }
                  assignmentType: { type: string, enum: [RIDE, COURIER, RENTAL] }
                  assignmentId: { type: string }
                  status: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /drivers/me/subscription:
    post:
      tags: [Subscriptions]
      summary: Subscribe (or switch) to a plan (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, currentPeriodEnd]
              properties:
                planId: { type: string }
                currentPeriodEnd: { type: string, format: date-time }
      responses:
        "201":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverSubscription" }
    get:
      tags: [Subscriptions]
      summary: My own subscription (Driver)
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverSubscription" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Subscriptions]
      summary: Cancel my own subscription (Driver)
      responses:
        "200":
          description: Cancelled subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverSubscription" }
        "404": { $ref: "#/components/responses/NotFound" }
  /drivers/{id}:
    get:
      tags: [Drivers]
      summary: Get a driver with documents (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "404": { $ref: "#/components/responses/NotFound" }
  /drivers/{id}/status:
    patch:
      tags: [Drivers]
      summary: Suspend/reactivate a driver (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/DriverStatus" }
      responses:
        "200":
          description: Updated driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }

  /vehicles/me:
    get:
      tags: [Vehicles]
      summary: My own vehicles (Driver)
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vehicle" }
  /vehicles:
    post:
      tags: [Vehicles]
      summary: Add a vehicle (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "201":
          description: Created vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
  /vehicles/{id}:
    patch:
      tags: [Vehicles]
      summary: Update one of my own vehicles (Driver)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "404": { $ref: "#/components/responses/NotFound" }

  /rentals:
    post:
      tags: [Rentals]
      summary: List a vehicle for luxury rental (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleId, dailyRate, location]
              properties:
                vehicleId: { type: string }
                dailyRate: { type: number }
                location: { type: string }
      responses:
        "201":
          description: Rental listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalListing" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Rentals]
      summary: Browse rental listings (approved only, unless Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated rental listings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedRentalListing" }
  /rentals/mine:
    get:
      tags: [Rentals]
      summary: My own rental listings (Driver)
      responses:
        "200":
          description: Rental listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RentalListing" }
  /rentals/{id}/status:
    patch:
      tags: [Rentals]
      summary: Approve/reject a rental listing (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalListing" }
  /rentals/{id}/bookings:
    post:
      tags: [Rentals]
      summary: Book an APPROVED rental listing for a date range (any authenticated user)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startAt, endAt]
              properties:
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time }
      responses:
        "201":
          description: Booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalBooking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Overlaps an existing booking on this listing (code
            RENTAL_OVERLAP), or the listing isn't APPROVED
    get:
      tags: [Rentals]
      summary: View bookings for one of my listings (listing owner Driver, or Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RentalBooking" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /rentals/bookings/mine:
    get:
      tags: [Rentals]
      summary: My own bookings (renter)
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RentalBooking" }
  /rentals/bookings/{id}/decision:
    patch:
      tags: [Rentals]
      summary: Confirm or reject a REQUESTED booking (listing owner Driver)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [CONFIRMED, REJECTED] }
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalBooking" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Booking is not in a state this decision can apply to
  /rentals/bookings/{id}/activate:
    patch:
      tags: [Rentals]
      summary: >-
        Mark a CONFIRMED booking ACTIVE — handover done (listing owner
        Driver). This is the transition that actually reserves the driver
        via DriverAssignment; a driver already holding an active Ride/
        Courier/Rental assignment gets a 409 DRIVER_BUSY here instead.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalBooking" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Booking is not CONFIRMED (RentalBookingStateError), or the
            driver already holds an active assignment (code DRIVER_BUSY)
  /rentals/bookings/{id}/end:
    patch:
      tags: [Rentals]
      summary: >-
        Mark a booking COMPLETED (vehicle returned) or CANCELLED, releasing
        the driver's active RENTAL assignment if one exists (listing owner
        Driver)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [COMPLETED, CANCELLED] }
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalBooking" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Booking is not in a state this transition can apply to
  /rentals/bookings/{id}/cancel:
    patch:
      tags: [Rentals]
      summary: Cancel my own booking before it becomes ACTIVE (renter)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalBooking" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Booking is no longer REQUESTED or CONFIRMED

  /trips:
    post:
      tags: [Trips]
      summary: Request a trip (Rider)
      description: >-
        The fare is server-authoritative wherever possible: if distanceKm
        and durationMinutes are both given, estimatedFare is computed
        server-side from the active PricingRule/SurgeZone (same engine as
        GET /pricing/quote) and any client-supplied estimatedFare is
        ignored. Otherwise estimatedFare is required and, when a
        PricingRule is active, must be at least its base fare.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup, destination]
              properties:
                pickup: { type: string }
                destination: { type: string }
                estimatedFare:
                  type: number
                  description: Required only when distanceKm/durationMinutes are omitted.
                distanceKm: { type: number }
                durationMinutes: { type: number }
                zone: { type: string, description: "Surge zone name to check, same as GET /pricing/quote's zone param." }
                category: { type: string, default: Personal }
                pickupNote: { type: string }
      responses:
        "201":
          description: Trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: No active pricing rule configured
    get:
      tags: [Trips]
      summary: Monitor all trips (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated trips
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedTrip" }
  /trips/mine:
    get:
      tags: [Trips]
      summary: My own trip history, most recent first (Rider)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated trips
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedTrip" }
  /trips/{id}:
    get:
      tags: [Trips]
      summary: View a trip (rider/driver party to it, or Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /trips/{id}/status:
    patch:
      tags: [Trips]
      summary: >-
        Advance trip status (the trip's assigned Driver, or Admin). A Driver
        who is not the trip's assigned driver gets 403, even if they have no
        Driver profile at all. When status=COMPLETED, a given finalFare must
        be within 0.5x-2x the trip's own estimatedFare or the request is
        rejected with 400.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [MATCHED, IN_PROGRESS, COMPLETED, CANCELLED, DISPUTED] }
                finalFare: { type: number, description: "Only validated (0.5x-2x estimatedFare) when status=COMPLETED." }
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /trips/{id}/cancel:
    patch:
      tags: [Trips]
      summary: >-
        Cancel my own trip (Rider). Only allowed while the trip is still
        REQUESTED or MATCHED — once a driver has started it (IN_PROGRESS),
        it's COMPLETED/DISPUTED, or already CANCELLED, this returns 409.
        Admin cancellation is unchanged and still goes through
        PATCH /trips/{id}/status with status=CANCELLED.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Cancelled trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Trip is no longer in a cancellable state
  /trips/{id}/driver-location:
    get:
      tags: [Trips]
      summary: >-
        Poll the assigned driver's last known location (HTTP fallback for a
        client not holding a live WebSocket connection — see /docs on the
        WS wire protocol for the live-push equivalent)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Last known location
          content:
            application/json:
              schema:
                type: object
                properties:
                  driverId: { type: string }
                  lat: { type: number }
                  lng: { type: number }
                  updatedAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Trip not found, no driver assigned yet, or no location reported yet
  /trips/{id}/charge:
    post:
      tags: [Payments]
      summary: >-
        Charge the rider for a completed trip's final fare (Driver on the
        trip, or Admin). CARD creates a real Stripe PaymentIntent and
        returns the Payment as PENDING plus a clientSecret for the mobile
        app to confirm; the outcome (SUCCEEDED/FAILED) lands asynchronously
        via POST /billing/webhook. CASH/WALLET settle immediately, no
        Stripe involved.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [CARD, CASH, WALLET], default: CARD }
      responses:
        "201":
          description: Payment record (PENDING with a clientSecret for CARD, SUCCEEDED for CASH/WALLET)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Payment"
                  - type: object
                    properties:
                      clientSecret: { type: string, nullable: true }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Trip not eligible to be charged, or already charged

  /payments/{id}/receipt:
    get:
      tags: [Payments]
      summary: A receipt for a charged trip (the paying rider, or Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentId: { type: string }
                  tripId: { type: string }
                  pickup: { type: string }
                  destination: { type: string }
                  amount: { type: number }
                  currency: { type: string }
                  method: { type: string, enum: [CARD, CASH, WALLET] }
                  status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, REFUNDED] }
                  paidAt: { type: string, format: date-time, nullable: true }
                  issuedAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /billing/webhook:
    post:
      tags: [Payments]
      summary: Stripe webhook (not called by any RavelGo client — Stripe calls this directly)
      security: []
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A raw Stripe Event payload; signature-verified against STRIPE_WEBHOOK_SECRET
      responses:
        "200":
          description: Acknowledged
        "400":
          description: Missing/invalid signature

  /documents/me:
    get:
      tags: [Documents]
      summary: My own driver documents (Driver)
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DriverDocument" }
  /documents:
    post:
      tags: [Documents]
      summary: Register an uploaded document's metadata (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, fileKey]
              properties:
                title: { type: string }
                fileKey: { type: string }
      responses:
        "201":
          description: Document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDocument" }
  /documents/{id}/review:
    patch:
      tags: [Documents]
      summary: Approve/reject a document (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverDocument" }

  /support-tickets:
    post:
      tags: [Support]
      summary: Open a support ticket (any authenticated user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, category]
              properties:
                subject: { type: string }
                category: { type: string }
      responses:
        "201":
