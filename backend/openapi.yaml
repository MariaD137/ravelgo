      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated available requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCourierRequest" }
  /courier-requests/{id}:
    get:
      tags: [Courier]
      summary: View a courier request (party to it, or Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Courier request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /courier-requests/{id}/accept:
    patch:
      tags: [Courier]
      summary: Accept a courier request (Driver)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Matched request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Request already matched
  /courier-requests/{id}/status:
    patch:
      tags: [Courier]
      summary: >-
        Advance courier status (assigned Driver, or Admin). When
        status=DELIVERED, a given finalFare must be within 0.5x-2x the
        request's own estimatedFare or the request is rejected with 400.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [IN_TRANSIT, DELIVERED, CANCELLED] }
                finalFare: { type: number, description: "Only validated (0.5x-2x estimatedFare) when status=DELIVERED." }
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourierRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

