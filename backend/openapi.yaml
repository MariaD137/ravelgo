        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Aggregated financial figures
          content:
            application/json:
              schema:
                type: object
                properties:
                  grossMarketplaceVolume: { type: number }
                  ravelgoRevenue: { type: number, description: Total commission earned }
                  driverEarnings: { type: number }
                  refunds: { type: number }
                  cancellationFees: { type: number }
                  waitingCharges: { type: number }
                  rideRevenue: { type: number }
                  deliveryRevenue: { type: number }
                  cashCommissionRecorded: { type: number, description: "Commission recorded against CASH transactions in the window — see GET /admin/cash-reconciliation for the true outstanding figure net of remittances" }

  /trips/{id}/arrived:
    post:
      tags: [Trips]
      summary: Driver reports physical arrival at pickup — anchors the free-waiting-period clock (Driver, owner only)
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Trip with arrivedAt set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }

  /trips/{id}/accept:
    post:
      tags: [Trips]
      summary: >-
        Driver accepts a trip OFFERED to them, moving it OFFERED -> MATCHED
        (Driver, the offered driver only). Atomic — a stale/expired offer, or
        one already resolved another way, returns 409 rather than silently
        succeeding.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The now-MATCHED trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "409":
          description: Offer no longer available (expired, declined, or resolved elsewhere)

  /trips/{id}/decline:
    post:
      tags: [Trips]
      summary: >-
        Driver declines a trip OFFERED to them (Driver, the offered driver
        only). Never cancels the rider's trip — releases the offer and the
        matching engine immediately re-offers it to the next eligible
        driver, excluding this one for the rest of this trip's lifetime.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Declined; the trip has been released and, if possible, re-offered
        "409":
          description: Offer no longer available (already expired or resolved elsewhere)

  /trips/{id}/refund:
    post:
      tags: [Payments]
      summary: Refund a trip's payment, full or partial, reversing its commission (Admin, payouts:write)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                amount: { type: number, description: Omit for a full refund }
                reason: { type: string }
      responses:
        "200":
          description: Refund result
          content:
            application/json:
              schema:
                type: object
                properties:
                  refunded: { type: number }

  /courier-requests/{id}/charge:
    post:
      tags: [Payments]
      summary: Charge the sender for a delivered package's final fare (Driver assigned to it, or Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [CARD, WALLET, CASH] }
      responses:
        "201":
          description: Payment
  /courier-requests/{id}/pay:
    post:
      tags: [Payments]
      summary: Pay for my own delivered package (Rider who sent it)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [CARD, WALLET, CASH] }
      responses:
        "201":
          description: Payment
  /courier-requests/{id}/refund:
    post:
      tags: [Payments]
      summary: Refund a delivery's payment, full or partial (Admin, payouts:write)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                amount: { type: number }
                reason: { type: string }
      responses:
        "200":
          description: Refund result

  /wallet/me:
    get:
      tags: [Wallet]
      summary: My RavelGo wallet balance (any authenticated user)
      responses:
        "200":
          description: Wallet balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance: { type: number }
                  currency: { type: string }
  /wallet/transactions:
    get:
      tags: [Wallet]
      summary: My wallet transaction history (any authenticated user)
      responses:
        "200":
          description: Recent wallet transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    type: { type: string, enum: [TOPUP, RIDE_PAYMENT, REFUND] }
                    status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
                    amount: { type: number }
                    tripId: { type: string, nullable: true }
                    createdAt: { type: string, format: date-time }
  /wallet/topup:
    post:
      tags: [Wallet]
      summary: >-
        Add funds to my wallet. Initializes a Paystack transaction and
        returns an authorizationUrl for the mobile app to open; the balance
        is credited only once Paystack confirms the charge via POST
        /billing/webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, description: "Amount to add (> 0)" }
      responses:
        "201":
          description: Top-up initiated (PENDING until the webhook confirms)
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizationUrl: { type: string }
                  amount: { type: number }
                  status: { type: string, enum: [PENDING] }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Cognito access token

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    BadRequest:
      description: Validation or bad request error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Caller lacks the required Cognito group
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Conflict (e.g., duplicate resource)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimitExceeded:
      description: Too many requests
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    DriverStatus:
      type: string
      enum: [ACTIVE, PENDING_REVIEW, SUSPENDED]

    User:
      type: object
      properties:
        id: { type: string }
        cognitoSub: { type: string }
        role: { type: string, enum: [RIDER, DRIVER, ADMIN] }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phoneNumber: { type: string, nullable: true }
        isLoyaltyMember: { type: boolean }
        suspended: { type: boolean }
        createdAt: { type: string, format: date-time }

    Driver:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        status: { $ref: "#/components/schemas/DriverStatus" }
        rating: { type: number }
        totalTrips: { type: integer }
        preferredLanguage: { type: string }
        subscriptionActive: { type: boolean }

    VehicleInput:
      type: object
      properties:
        brand: { type: string }
        model: { type: string }
        colour: { type: string }
        plateNumber: { type: string }
        year: { type: string }
        isPrimary: { type: boolean }
        photoKeys:
          type: array
          maxItems: 7
          items: { type: string }
          description: S3 keys from POST /uploads/presign (bucket "assets"), up to 7 per vehicle.

    VehicleUpdateInput:
      type: object
      properties:
        brand: { type: string }
        model: { type: string }
        colour: { type: string }
        plateNumber: { type: string }
        year: { type: string }
        isPrimary: { type: boolean }
        addPhotoKeys:
          type: array
          maxItems: 7
          items: { type: string }
          description: Newly presigned S3 keys to append to the vehicle's existing photos.
        removePhotoUrls:
          type: array
          maxItems: 7
          items: { type: string }
          description: photoUrl values (as returned by GET) of existing photos to remove.

    Vehicle:
      allOf:
        - $ref: "#/components/schemas/VehicleInput"
        - type: object
          properties:
            id: { type: string }
            driverId: { type: string }
            listedForRental: { type: boolean }
            photoUrl: { type: string, nullable: true, description: "The first photo's public CDN URL, or null." }
            photoUrls:
              type: array
              items: { type: string }
              description: All of this vehicle's public CDN photo URLs. Raw S3 keys are never returned.

    AdminRole:
      type: string
      enum: [SUPER_ADMIN, OPERATIONS_MANAGER, SUPPORT_AGENT, FINANCE_VIEWER]
      description: >
        Fixed permission presets (see backend/src/lib/admin-permissions.ts).
        Only SUPER_ADMIN holds manage_admins, so only a Super Admin can ever
        reach any /admin-users write endpoint.

    AdminUserInvite:
      type: object
      required: [email, firstName, lastName, adminRole]
      properties:
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        adminRole: { $ref: "#/components/schemas/AdminRole" }

    AdminUser:
      type: object
      properties:
        id: { type: string, nullable: true, description: "Null only for a legacy admin with no Postgres User row (see GET /admin-users/me)." }
        name: { type: string }
        email: { type: string }
        adminRole: { $ref: "#/components/schemas/AdminRole" }
        suspended: { type: boolean }
        status:
          type: string
          enum: [INVITED, ACTIVE, SUSPENDED, UNKNOWN]
          description: >
            Read live from Cognito, never cached: INVITED means Cognito's
            FORCE_CHANGE_PASSWORD status (temporary password emailed, first
            sign-in not completed yet). UNKNOWN means the Cognito account
            itself could not be found.
        mfaEnabled:
          type: boolean
          description: Whether this admin has a preferred MFA method set in Cognito (TOTP only in this pool).
        createdAt: { type: string, format: date-time, nullable: true }
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Stamped on every verified admin API call (there is no discrete
            login event in this stateless-bearer-token architecture) — reads
            as "last seen active" rather than a precise sign-in timestamp.
            Null until the admin's first authenticated call.

    RentalListing:
      type: object
      properties:
        id: { type: string }
        driverId: { type: string }
        vehicleId: { type: string }
        dailyRate: { type: number }
        location: { type: string }
        status: { type: string, enum: [PENDING_APPROVAL, APPROVED, REJECTED] }
        bookings:
          type: array
          description: Only populated on GET /rentals/mine (the owning driver's own view) — never on the public browse listing.
          items:
            type: object
            properties:
              id: { type: string }
              startDate: { type: string, format: date-time }
              endDate: { type: string, format: date-time }
              days: { type: integer }
              totalPrice: { type: number }
              status: { type: string, enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED, COMPLETED] }
              paymentStatus: { type: string, enum: [PENDING, SUCCEEDED, FAILED, REFUNDED] }
              renter:
                type: object
                description: First/last name only — never email, phone, or Cognito sub.
                properties:
                  firstName: { type: string, nullable: true }
                  lastName: { type: string, nullable: true }

    Trip:
      type: object
      properties:
        id: { type: string }
        riderId: { type: string }
        driverId: { type: string, nullable: true }
        pickup: { type: string }
        destination: { type: string }
        estimatedFare: { type: number }
        finalFare: { type: number, nullable: true }
        status: { type: string, enum: [REQUESTED, OFFERED, MATCHED, IN_PROGRESS, COMPLETED, CANCELLED, DISPUTED], description: "OFFERED means a specific driver has this trip pending their accept/decline (see POST /trips/{id}/accept and /decline); MATCHED means that driver has actually accepted." }
        category: { type: string }
        rideCategoryKey: { type: string, nullable: true, description: "The ride tier chosen (RideCategory.key), e.g. SWIFT" }
        distanceKm: { type: number, nullable: true }
        arrivedAt: { type: string, format: date-time, nullable: true }
        commissionRate: { type: number, nullable: true, description: Locked in at payment settlement, never recalculated later }
        platformCommission: { type: number, nullable: true }
        driverEarnings: { type: number, nullable: true }
        waitingCharge: { type: number, nullable: true, description: 100% driver-compensation, not commissioned }
        cancellationFee: { type: number, nullable: true, description: 100% driver-compensation, not commissioned }
        payment:
          allOf: [{ $ref: "#/components/schemas/Payment" }]
          nullable: true
          description: >-
            Only present on GET /trips/{id} for the trip's own rider/driver
            or Admin — never on GET /trips/mine.

    DriverDocument:
      type: object
      properties:
        id: { type: string }
        driverId: { type: string }
        title: { type: string }
        status: { type: string, enum: [NOT_UPLOADED, PENDING, APPROVED, EXPIRING_SOON, REJECTED] }
        fileKey: { type: string, nullable: true }

    SupportTicket:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        subject: { type: string }
        category: { type: string }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }

    CarPaddyRequest:
      type: object
      properties:
        id: { type: string }
        driverId: { type: string }
        plateNumber: { type: string }
        status: { type: string, enum: [SUBMITTED, IN_REVIEW, APPROVED, REJECTED] }

    CourierRequestInput:
      type: object
      properties:
        pickupAddress: { type: string }
        dropoffAddress: { type: string }
        packageDescription: { type: string }
        recipientName: { type: string }
        recipientPhone: { type: string }
        estimatedFare: { type: number }
        pickupLat: { type: number, nullable: true, description: Resolved by the sender's Places-backed address search; optional. }
        pickupLng: { type: number, nullable: true }
        dropoffLat: { type: number, nullable: true }
        dropoffLng: { type: number, nullable: true }

    CourierRequest:
      allOf:
        - $ref: "#/components/schemas/CourierRequestInput"
        - type: object
          properties:
            id: { type: string }
            senderId: { type: string }
            driverId: { type: string, nullable: true }
            deliveryVehicleClass: { type: string, nullable: true, enum: [BIKE, CAR, SUV, VAN] }
            finalFare: { type: number, nullable: true }
            commissionRate: { type: number, nullable: true, description: Locked in at payment settlement }
            platformCommission: { type: number, nullable: true }
            driverEarnings: { type: number, nullable: true }
            cancellationFee: { type: number, nullable: true }
            status: { type: string, enum: [REQUESTED, MATCHED, PICKED_UP, IN_TRANSIT, DELIVERED, CANCELLED] }
            courierLat:
              type: number
              nullable: true
              description: >-
                Only on GET /courier-requests/{id} — the assigned courier's
                current position, reusing the same driver GPS feed as the
                admin Live Map (never a second tracking system). Null until
                that driver has reported at least one location.
            courierLng: { type: number, nullable: true }
            courierLocationUpdatedAt: { type: string, format: date-time, nullable: true }
            courierPresence:
              type: string
              nullable: true
              enum: [LIVE, STALE]
              description: Null when no location has been reported yet.

    EmergencyAlert:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        tripId: { type: string, nullable: true }
        type: { type: string, enum: [SOS, FRAUD_SUSPECTED] }
        message: { type: string, nullable: true }
        status: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] }

    SubscriptionPlan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        priceMonthly: { type: number }
        active: { type: boolean }

    DriverSubscription:
      type: object
      properties:
        id: { type: string }
        driverId: { type: string }
        planId: { type: string }
        status: { type: string, enum: [ACTIVE, CANCELLED, EXPIRED] }
        currentPeriodEnd: { type: string, format: date-time }

    Payment:
      type: object
      properties:
        id: { type: string }
        tripId: { type: string }
        userId: { type: string }
        amount: { type: number }
        currency: { type: string }
        method: { type: string, enum: [CARD, CASH, WALLET] }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, REFUNDED] }

    LoyaltyTier:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        minCompletedTrips: { type: integer }
        discountPercent: { type: number }
        perks: { type: string, nullable: true }

    Promotion:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        description: { type: string }
        discountPercent: { type: number }
        active: { type: boolean }
        expiresAt: { type: string, format: date-time, nullable: true }
        maxRedemptions: { type: integer, nullable: true }
        redemptionCount: { type: integer }

    PromotionRedemption:
      type: object
      properties:
        id: { type: string }
        promotionId: { type: string }
        userId: { type: string }
        redeemedAt: { type: string, format: date-time }

    PricingRule:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        baseFare: { type: number }
        perKm: { type: number }
        perMinute: { type: number }
        active: { type: boolean }

    SurgeZone:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        location: { type: string }
        multiplier: { type: number }
        active: { type: boolean }
        startsAt: { type: string, format: date-time, nullable: true }
        endsAt: { type: string, format: date-time, nullable: true }

    RideCategory:
      type: object
      properties:
        id: { type: string }
        key: { type: string, description: "Stable identifier, e.g. SWIFT" }
        name: { type: string }
        description: { type: string }
        benefit: { type: string, nullable: true }
        baseFare: { type: number }
        perKm: { type: number }
        perMinute: { type: number }
        minimumFare: { type: number }
        commissionRate: { type: number, nullable: true, description: Overrides the RIDE service default when set }
        active: { type: boolean }
        sortOrder: { type: integer }
        eligibleVehicleClasses:
          type: array
          items: { type: string, enum: [ECONOMY, COMFORT, PREMIUM, LUXURY] }
          description: Empty = no restriction, any vehicle is eligible

    RideCategoryInput:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        benefit: { type: string }
        baseFare: { type: number }
        perKm: { type: number }
        perMinute: { type: number }
        minimumFare: { type: number }
        commissionRate: { type: number }
        sortOrder: { type: integer }
        eligibleVehicleClasses:
          type: array
          items: { type: string, enum: [ECONOMY, COMFORT, PREMIUM, LUXURY] }
        active: { type: boolean }

    CategoryQuote:
      type: object
      properties:
        categoryKey: { type: string }
        name: { type: string }
        description: { type: string }
        benefit: { type: string, nullable: true }
        estimatedFare: { type: number }
        subtotal: { type: number }
        tax: { type: number }
        taxRate: { type: number }
        surgeMultiplier: { type: number }
        distanceKm: { type: number }
        tripEtaMinutes: { type: number }
        pickupEtaMinutes: { type: number, nullable: true, description: "null when no eligible online driver has a live location" }
        availability: { type: string, enum: [AVAILABLE, LIMITED, UNAVAILABLE] }
        commissionRate: { type: number }

    DeliveryVehicleRate:
      type: object
      properties:
        id: { type: string }
        vehicleClass: { type: string, enum: [BIKE, CAR, SUV, VAN] }
        name: { type: string }
        initialFee: { type: number }
        perKm: { type: number }
        commissionRate: { type: number, nullable: true, description: Overrides the DELIVERY service default when set }
        active: { type: boolean }

    DeliveryQuote:
      type: object
      properties:
        vehicleClass: { type: string, enum: [BIKE, CAR, SUV, VAN] }
        name: { type: string }
        estimatedFare: { type: number }
        initialFee: { type: number }
        distanceFee: { type: number }
        packageSurcharge: { type: number }
        commissionRate: { type: number }

    CommissionConfig:
      type: object
      properties:
        service: { type: string, enum: [RIDE, DELIVERY] }
        rate: { type: number, minimum: 0, maximum: 1 }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string, nullable: true }

    PricingPolicy:
      type: object
      properties:
        rideCancellationGraceSec: { type: integer }
        rideCancellationFee: { type: number }
        rideWaitingFreeSec: { type: integer }
        rideWaitingPerMinute: { type: number }
        rideWaitingMaxFee: { type: number }
        deliveryCancellationGraceSec: { type: integer }
        deliveryCancellationFee: { type: number }
        additionalStopFee: { type: number }
        surgeMinMultiplier: { type: number }
        surgeMaxMultiplier: { type: number }
        packageSizeSurcharge:
          type: object
          additionalProperties: { type: number }
          description: "Additive surcharge by CourierRequest.packageSize, e.g. {\"SMALL\":0,\"MEDIUM\":300,\"LARGE\":800}"

    PaginatedUser:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/User" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedDriver:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Driver" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedTrip:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Trip" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedRentalListing:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/RentalListing" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedSupportTicket:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/SupportTicket" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedCarPaddyRequest:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/CarPaddyRequest" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedCourierRequest:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/CourierRequest" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    Notification:
      type: object
      description: >-
        Created only from a real backend event (a ride/delivery/rental
        status change, a payment outcome) — never fabricated client-side.
        See backend/src/lib/notifications.ts for the exact call sites.
      properties:
        id: { type: string }
        userId: { type: string }
        type:
          type: string
          enum:
            - RIDE_DRIVER_ASSIGNED
            - RIDE_STARTED
            - RIDE_COMPLETED
            - RIDE_CANCELLED
            - DELIVERY_COURIER_ASSIGNED
            - DELIVERY_PICKED_UP
            - DELIVERY_IN_TRANSIT
            - DELIVERY_DELIVERED
            - DELIVERY_CANCELLED
            - RENTAL_CONFIRMED
            - RENTAL_CANCELLED
            - PAYMENT_SUCCEEDED
            - PAYMENT_FAILED
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        referenceType: { type: string, nullable: true, enum: [TRIP, COURIER_REQUEST, RENTAL_BOOKING, PAYMENT] }
        referenceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    PaginatedNotification:
      allOf:
        - type: object
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Notification" } }
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
            unreadCount: { type: integer }

    DeviceTokenInput:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, description: The real FCM (Android) or APNs (iOS) device token. }
        platform: { type: string, enum: [IOS, ANDROID] }

    DeviceTokenRegistration:
      type: object
      properties:
        id: { type: string }
        platform: { type: string, enum: [IOS, ANDROID] }
        registered:
          type: boolean
          description: >-
            Whether the backend has a Pinpoint application configured at
            all (PINPOINT_APPLICATION_ID) — false just means the token was
            recorded but no push will be sent yet.

    PaginatedEmergencyAlert:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/EmergencyAlert" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    PaginatedPayment:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Payment" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    # Standardized error response (PL-01)
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, timestamp]
          properties:
            code:
              type: string
              description: Machine-readable error code
              enum:
                - VALIDATION_ERROR
                - AUTHENTICATION_ERROR
                - AUTHORIZATION_ERROR
                - NOT_FOUND
                - CONFLICT
                - INTERNAL_SERVER_ERROR
                - RATE_LIMIT_EXCEEDED
                - BAD_REQUEST
                - PAYMENT_ERROR
                - DATABASE_ERROR
            message:
              type: string
              description: Human-readable error message
            details:
              type: array
              nullable: true
              description: Field-level validation errors
              items:
                type: object
                properties:
                  field: { type: string, description: 'Field name or path (e.g., "email", "address.zipCode")' }
                  message: { type: string, description: Error message for this field }
                  code: { type: string, nullable: true, description: 'Error code (e.g., "too_small", "invalid_email")' }
            timestamp:
              type: string
              format: date-time
              description: When the error occurred (ISO 8601)
