        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated tickets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedSupportTicket" }
  /support-tickets/mine:
    get:
      tags: [Support]
      summary: My own support tickets (any authenticated user)
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportTicket" }
  /support-tickets/{id}/status:
    patch:
      tags: [Support]
      summary: Update ticket status (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED] }
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }

  /uploads/presign:
    post:
      tags: [Uploads]
      summary: Get a short-lived S3 upload URL (any authenticated user)
      description: >-
        contentType must be one of application/pdf, image/jpeg, image/png,
        image/webp for bucket=documents, or one of image/jpeg, image/png,
        image/webp for bucket=assets (assets is served publicly through
        CloudFront, so HTML/SVG content types are rejected to prevent
        stored-XSS via a directly-navigated asset URL). fileName is limited
        to letters, digits, spaces, `.`, `-`, `_` and 200 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket, fileName, contentType]
              properties:
                bucket: { type: string, enum: [documents, assets] }
                fileName: { type: string, maxLength: 200, pattern: "^[\\w.\\- ]{1,200}$" }
                contentType: { type: string, enum: [application/pdf, image/jpeg, image/png, image/webp] }
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl: { type: string }
                  fileKey: { type: string }
                  expiresIn: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /car-paddy:
    post:
      tags: [Car Paddy]
      summary: Submit a Car Paddy (vehicle license renewal) request (Driver)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plateNumber]
              properties:
                plateNumber: { type: string }
      responses:
        "201":
          description: Request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarPaddyRequest" }
    get:
      tags: [Car Paddy]
      summary: List all Car Paddy requests (Admin)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Paginated requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCarPaddyRequest" }
  /car-paddy/{id}:
    patch:
      tags: [Car Paddy]
      summary: Approve/reject a Car Paddy request (Admin)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CarPaddyRequest" }

  /admin/dashboard:
    get:
      tags: [Admin]
