name: Backend CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ravelgo
          POSTGRES_PASSWORD: ravelgo
          POSTGRES_DB: ravelgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ravelgo:ravelgo@localhost:5432/ravelgo_test
      # Dummy — QA-01's tests mock the Cognito verifier and the Stripe SDK
      # directly, so no real credentials are needed to run them in CI.
      COGNITO_USER_POOL_ID: us-east-1_ciPool0000
      COGNITO_CLIENT_ID: ciclientid0000000000000
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      # Dummy — presigning is offline crypto (no real S3 call), but the
      # route now 500s on an unconfigured bucket name instead of silently
      # signing a broken URL, so tests need these set to reach that path.
      DOCUMENTS_BUCKET: ravelgo-ci-documents
      ASSETS_BUCKET: ravelgo-ci-assets
      # Dummy — SigV4 presigning still has to resolve *some* credentials to
      # compute the signature, even though it makes no real S3 call. With
      # none set, the SDK's default provider chain falls through to probing
      # the EC2 instance-metadata service (169.254.169.254), which is a
      # real but unreachable link-local address on a GitHub Actions runner
      # (not an EC2 instance) — it times out per provider instead of
      # failing fast, stalling the test run for minutes. Setting static
      # keys short-circuits straight to them. Production uses the App
      # Runner instance role instead; this is CI-only.
      AWS_ACCESS_KEY_ID: ci-dummy-access-key-id
      AWS_SECRET_ACCESS_KEY: ci-dummy-secret-access-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # QA-03: this step didn't exist before — package.json has always had a
      # test script, but nothing in CI ran it, so a failing test never
      # failed a PR. Runs last since it's the slowest step and the others
      # fail faster on the more common mistakes (lint/type errors).
      - name: Test
        run: npm test
