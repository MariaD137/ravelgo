name: Deploy to Staging

# Manual only, on purpose — this does NOT run on every push to main. Staging
# deploys are something you trigger deliberately: from the Actions tab, pick
# this workflow and click "Run workflow" (branch defaults to main), or ask
# Claude to run it. This avoids surprise AWS deployments from an ordinary
# push.
on:
  workflow_dispatch: {}

permissions:
  id-token: write # required to assume the AWS role via OIDC
  contents: read

# Only one staging deploy runs at a time; a second run queues behind it
# rather than racing it (never cancels a deploy already in flight).
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  # Database migrations stay a deliberate manual step (see
  # scripts/migrate-staging.sh) — the backend has no public DB endpoint, so
  # applying one requires a CodeBuild job running inside the VPC, and running
  # that unattended would need granting this workflow's AWS role IAM
  # self-service permissions this repo has decided against (see
  # infra/lib/ci-stack.ts and infra/bin/infra.ts). This job never blocks the
  # deploy (a permanently-red, unblockable gate would be worse than a missed
  # migration) — it just makes sure one is never applied silently by loudly
  # warning when the commit you're deploying adds one.
  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Warn if the deployed commit adds Prisma migrations
        run: |
          if git diff --name-only HEAD~1 HEAD -- backend/prisma/migrations | grep -q .; then
            echo "::warning::The commit being deployed adds or changes Prisma migrations. Run 'bash scripts/migrate-staging.sh' against staging before (or right after) this deploy, or the backend may not work against the old schema. New migration files:"
            git diff --name-only HEAD~1 HEAD -- backend/prisma/migrations
          else
            echo "No migration changes in the commit being deployed."
          fi

  backend:
    # Deploy only once the one-time AWS setup has been done (an OIDC deploy
    # role in AWS — see infra/bin/infra.ts's staging CiStack, deployed via
    # `npm run bootstrap-ci-staging` in infra/ — plus the AWS_STAGING_DEPLOY_ROLE_ARN
    # / AWS_REGION GitHub → Settings → Secrets and variables → Actions →
    # Variables). Skips cleanly before that setup exists, same as
    # backend-deploy.yml does for production.
    if: vars.AWS_STAGING_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Discover the staging ECR repository
        id: ecr
        run: |
          set -euo pipefail
          URI="$(aws ecr describe-repositories --repository-names ravelgo-backend-staging \
            --query 'repositories[0].repositoryUri' --output text)"
          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push image
        working-directory: backend
        env:
          REPOSITORY_URI: ${{ steps.ecr.outputs.uri }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$REPOSITORY_URI:$IMAGE_TAG" -t "$REPOSITORY_URI:latest" .
          docker push "$REPOSITORY_URI:$IMAGE_TAG"
          docker push "$REPOSITORY_URI:latest"

      - name: Trigger App Runner deployment
        id: deploy
        run: |
          set -euo pipefail
          SERVICE_ARN="$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='ravelgo-backend-staging'].ServiceArn | [0]" --output text)"
          OPERATION_ID="$(aws apprunner start-deployment --service-arn "$SERVICE_ARN" --query OperationId --output text)"
          echo "service_arn=$SERVICE_ARN" >> "$GITHUB_OUTPUT"
          echo "operation_id=$OPERATION_ID" >> "$GITHUB_OUTPUT"

      # start-deployment only *queues* the rollout. Without this step a
      # deploy that App Runner then fails or rolls back (bad image, crashed
      # on boot, failed health check) still shows as a green run here while
      # staging keeps serving the previous build. Waits for the operation
      # and fails the job if it did not succeed.
      - name: Wait for the App Runner deployment to finish
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            STATUS="$(aws apprunner list-operations --service-arn "${{ steps.deploy.outputs.service_arn }}" \
              --query "OperationSummaryList[?Id=='${{ steps.deploy.outputs.operation_id }}'].Status | [0]" --output text)"
            echo "App Runner deployment status: $STATUS"
            case "$STATUS" in
              SUCCEEDED) exit 0 ;;
              FAILED|ROLLBACK_IN_PROGRESS|ROLLBACK_SUCCEEDED|ROLLBACK_FAILED)
                echo "::error::App Runner deployment ended in $STATUS — staging is still running the previous build. Check the service's deployment/application logs in the App Runner console."
                exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timed out after 20 minutes waiting for the App Runner deployment."
          exit 1

      # Prove the deployed backend actually works, not just that it started:
      # /health (DB reachable, Paystack configured?) and /health/pricing (the
      # tables GET /api/pricing/categories needs are present — a 503 here
      # means a Prisma migration was never applied to staging; run
      # scripts/migrate-staging.sh). Both are read-only and need no auth.
      - name: Smoke-test the deployed backend
        run: |
          set -euo pipefail
          API_URL="$(aws cloudformation describe-stacks --stack-name RavelGo-Api-staging \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceUrl'].OutputValue" --output text)"
          API_URL="${API_URL%/}"
          check() { # <path> <expected HTTP status>
            local body code
            body="$(curl -sS --max-time 20 -o /tmp/resp.json -w '%{http_code}' "$API_URL$1" || true)"
            code="$body"
            echo "GET $1 -> HTTP $code: $(head -c 600 /tmp/resp.json 2>/dev/null)"
            if [[ "$code" != "$2" ]]; then
              echo "::error::GET $1 returned HTTP $code (expected $2)."
              return 1
            fi
          }
          check /health 200
          check /health/pricing 200
          # The rider fare endpoint must exist (401 = present but needs a
          # token; 404 would mean the deployed image is stale).
          check "/api/pricing/categories?pickupLat=6.5&pickupLng=3.4&distanceKm=1&durationMinutes=5" 401
          PAYSTACK="$(curl -sS --max-time 20 "$API_URL/health" | sed -n 's/.*"paystack":"\([^"]*\)".*/\1/p')"
          if [[ "$PAYSTACK" == unconfigured* ]]; then
            echo "::warning::Paystack is $PAYSTACK on staging — card payments, wallet top-ups and payouts will fail until the real secret key is set in Secrets Manager and the service is redeployed (see infra/lib/api-stack.ts)."
          fi

  web:
    needs: backend
    if: vars.AWS_STAGING_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: staging
    # The `secrets` context can't be used in a step's `if:` (GitHub rejects
    # the whole workflow file if it is — see the step below), so it's copied
    # into a job-level env var here, which `if:` can read instead.
    env:
      HAS_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: user_app
            path: rider-web
            label: Rider app
          - app: driver_app
            path: driver-web
            label: Driver app
          - app: admin_app
            path: admin-web
            label: Admin app
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Reads the same deployed-stack outputs scripts/host-web-staging.sh
      # does, so the web build's backend/Cognito config can never drift from
      # what's actually deployed.
      - name: Discover deployed config
        id: config
        run: |
          set -euo pipefail
          BUCKET="$(aws cloudformation describe-stacks --stack-name RavelGo-Storage-staging \
            --query "Stacks[0].Outputs[?OutputKey=='AssetsBucketName'].OutputValue" --output text)"
          DOMAIN="$(aws cloudformation describe-stacks --stack-name RavelGo-Storage-staging \
            --query "Stacks[0].Outputs[?OutputKey=='AssetsDistributionDomain'].OutputValue" --output text)"
          DIST_ID="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='$DOMAIN'].Id | [0]" --output text)"
          API_URL="$(aws cloudformation describe-stacks --stack-name RavelGo-Api-staging \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceUrl'].OutputValue" --output text)"
          POOL_ID="$(aws cloudformation describe-stacks --stack-name RavelGo-Auth-staging \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" --output text)"
          CLIENT_ID="$(aws cloudformation describe-stacks --stack-name RavelGo-Auth-staging \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" --output text)"
          {
            echo "bucket=$BUCKET"
            echo "domain=$DOMAIN"
            echo "dist_id=$DIST_ID"
            echo "api_url=$API_URL"
            echo "pool_id=$POOL_ID"
            echo "client_id=$CLIENT_ID"
          } >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # Your Google Maps browser key (optional): set it once as the repo/
      # environment secret GOOGLE_MAPS_API_KEY. It's fine for this key to ship
      # in the web build — it's public by design and should be restricted to
      # your CloudFront domain in the Google console. Left blank, the apps
      # still build and deploy; maps just render blank.
      - name: Write .env
        working-directory: ${{ matrix.app }}
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          cat > .env <<EOF
          GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
          API_BASE_URL=${{ steps.config.outputs.api_url }}
          COGNITO_USER_POOL_ID=${{ steps.config.outputs.pool_id }}
          COGNITO_CLIENT_ID=${{ steps.config.outputs.client_id }}
          AWS_REGION=${{ vars.AWS_REGION }}
          EOF

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Inject the Google Maps JS SDK into the page
        if: env.HAS_MAPS_KEY == 'true'
        working-directory: ${{ matrix.app }}
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          sed -i "s#</head>#  <script src=\"https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}\"></script>\n  </head>#" web/index.html

      - name: Build web
        working-directory: ${{ matrix.app }}
        run: flutter build web --release --base-href "/${{ matrix.path }}/"

      - name: Publish to S3
        working-directory: ${{ matrix.app }}
        run: aws s3 sync build/web "s3://${{ steps.config.outputs.bucket }}/${{ matrix.path }}/" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.config.outputs.dist_id }}" --paths "/${{ matrix.path }}/*"

      - name: Print link
        run: |
          echo "${{ matrix.label }} -> https://${{ steps.config.outputs.domain }}/${{ matrix.path }}/index.html"
